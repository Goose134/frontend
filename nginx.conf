server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /save {
        proxy_pass http://backend:5000;
    }

    location /data {
        proxy_pass http://backend:5000;
    }
}